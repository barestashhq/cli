name: Dependency Review

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Policy: fail PRs on moderate-or-higher vulnerabilities in dependencies of any known or unknown scope.
      # License policy covers the permissive SPDX expressions in Cargo.lock.
      # PR comments stay disabled to keep workflow permissions at contents: read.
      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          fail-on-scopes: runtime, development, unknown
          license-check: true
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD, BSL-1.0, CDLA-Permissive-2.0, Unicode-3.0, Unlicense, Zlib
          show-patched-versions: true
