name: Release native binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            cross: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
            cross: true
          - os: macos-15
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip

    env:
      RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@2eae45db285e407f22119950686d47e1101e071b # 1.88.0
        with:
          toolchain: 1.88.0
          targets: ${{ matrix.target }}

      - name: Verify release tag and quality gates
        if: runner.os == 'Linux' && matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          if [[ "${GITHUB_REF_TYPE:-branch}" == "tag" && "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Cargo version v${version}." >&2
            exit 1
          fi
          cargo fmt --all --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all --locked

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2.85.12
        with:
          tool: cross@0.2.5

      - name: Build with Cargo
        if: ${{ !matrix.cross }}
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Build with cross
        if: matrix.cross
        run: cross build --locked --release --target ${{ matrix.target }}

      - name: Package Unix archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          version="${RELEASE_VERSION}"
          name="barestash-${version}-${{ matrix.target }}"
          mkdir -p "artifacts/${name}"
          cp "target/${{ matrix.target }}/release/barestash" "artifacts/${name}/"
          cp README.md LICENSE THIRD_PARTY_NOTICES.md "artifacts/${name}/"
          tar -C artifacts -czf "artifacts/${name}.tar.gz" "${name}"
          (cd artifacts && shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256")
          (cd artifacts && shasum -a 256 -c "${name}.tar.gz.sha256")

      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:RELEASE_VERSION
          $name = "barestash-$version-${{ matrix.target }}"
          New-Item -ItemType Directory -Force "artifacts/$name" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/barestash.exe" "artifacts/$name/"
          Copy-Item README.md,LICENSE,THIRD_PARTY_NOTICES.md "artifacts/$name/"
          Compress-Archive -Path "artifacts/$name" -DestinationPath "artifacts/$name.zip"
          $hash = (Get-FileHash "artifacts/$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Set-Content -NoNewline "artifacts/$name.zip.sha256"
          if ((Get-FileHash "artifacts/$name.zip" -Algorithm SHA256).Hash.ToLower() -ne $hash) {
            throw "Archive checksum verification failed."
          }

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: barestash-${{ matrix.target }}
          path: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/*.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes
          fi
          gh release upload "${GITHUB_REF_NAME}" artifacts/* --clobber
