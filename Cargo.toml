[workspace]
resolver = "3"
members = [
    "crates/barestash",
    "crates/barestash-client",
    "crates/barestash-protocol",
]
default-members = [
    "crates/barestash",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/barestashhq/cli"
homepage = "https://github.com/barestashhq/cli"
publish = false
readme = "README.md"

[workspace.dependencies]
barestash-client = { version = "0.0.1", path = "crates/barestash-client" }
barestash-protocol = { version = "0.0.1", path = "crates/barestash-protocol" }
reqwest = { version = "0.12.23", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
url = "2.5.4"
wiremock = "0.6.4"

[profile.release]
lto = "thin"
strip = "symbols"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
