[package]
name = "barestash"
version = "0.0.1"
edition = "2024"
rust-version = "1.88"
description = "A native request stash CLI for webhooks, scripts, and AI agents"
license = "MIT"
repository = "https://github.com/barestashhq/cli"
homepage = "https://github.com/barestashhq/cli"
keywords = ["webhook", "request-bin", "cli", "jsonl", "developer-tools"]
categories = ["command-line-utilities", "development-tools"]
publish = false
include = [
    "/src/**",
    "/tests/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE",
    "/THIRD_PARTY_NOTICES.md",
]

[[bin]]
name = "barestash"
path = "src/main.rs"

[dependencies]
base64 = "0.22.1"
chrono = { version = "0.4.41", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5.45", features = ["derive"] }
fs4 = "1.1.0"
futures-util = "0.3.31"
hostname = "0.4.1"
home = "0.5.11"
keyring = "4.1.6"
reqwest = { version = "0.12.23", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
terminal_size = "0.4.3"
tempfile = "3.21.0"
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
toml = "1.1"
unicode-segmentation = "1.12.0"
unicode-width = "0.2.1"
url = "2.5.4"
uuid = { version = "1.18.0", features = ["v4"] }

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
# `keytar` used `service` + `account` Secret Service attributes, while the
# modern keyring backend uses `service` + `username`. Read and remove the old
# item during migration so Linux users keep their existing login.
secret-service = { version = "5.1.0", default-features = false, features = ["rt-tokio-crypto-rust"] }

[target.'cfg(windows)'.dependencies]
# keytar addressed Windows credentials as `service/account`; access that
# target explicitly so existing TypeScript CLI logins can be migrated.
keyring-core = "1.0.0"
windows-native-keyring-store = "1.1.0"

[dev-dependencies]
assert_cmd = "2.0.17"
predicates = "3.1.3"
proc-macro2 = "1.0.107"
wiremock = "0.6.4"

[profile.release]
lto = "thin"
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
