[package]
name = "barestash"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A native request stash CLI for webhooks, scripts, and AI agents"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["webhook", "request-bin", "cli", "jsonl", "developer-tools"]
categories = ["command-line-utilities", "development-tools"]
publish.workspace = true
readme.workspace = true
include = [
    "/src/**",
    "/tests/**",
    "/Cargo.toml",
    "/LICENSE",
    "/THIRD_PARTY_NOTICES.md",
]

[[bin]]
name = "barestash"
path = "src/main.rs"

[dependencies]
barestash-application.workspace = true
barestash-presentation.workspace = true
clap = { version = "4.5.45", features = ["derive"] }
tokio.workspace = true

[dev-dependencies]
assert_cmd = "2.0.17"
predicates = "3.1.3"
serde_json.workspace = true
tempfile = "3.21.0"
toml = "1.1"
wiremock.workspace = true

[lints]
workspace = true
